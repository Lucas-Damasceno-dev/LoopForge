name: LoopForge CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Formatting & Linting (Ruff)
        run: |
          python -m ruff check --select E,F,W,I src/lf tests_py

      - name: Type Checking (Mypy)
        run: |
          python -m mypy src/lf --ignore-missing-imports

      - name: Unit Tests & Coverage Threshold Enforcement (>= 75%)
        run: |
          python -m pytest --cov=src/lf --cov-report=term-missing --cov-fail-under=75 tests_py/
