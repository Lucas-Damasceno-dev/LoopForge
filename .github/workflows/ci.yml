name: LoopForge CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e packages/genome packages/registry packages/retro
          pip install -e packages/genome packages/registry packages/retro

      - name: Code Formatting & Linting (Ruff - E,F,W,I,N,UP,SIM)
        run: |
          python -m ruff check src/lf tests

      - name: Type Checking (Mypy)
        run: |
          python -m mypy src/lf

      - name: Unit Tests & Coverage Threshold Enforcement (>= 75%)
        run: |
          python -m pytest --cov=src/lf --cov-report=term-missing --cov-fail-under=75 tests/
