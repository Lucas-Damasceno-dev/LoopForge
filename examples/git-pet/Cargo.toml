[package]
name = "git-pet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "git-pet"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
colored = "2.0"
dirs = "5.0"
rand = "0.8"

[dev-dependencies]
tempfile = "3.8"