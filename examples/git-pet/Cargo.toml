[package]
name = "git-pet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "git-pet"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "std"] }
anyhow = "1"
colored = "2"
dirs = "5"
rand = "0.8"

[dev-dependencies]
tempfile = "3"