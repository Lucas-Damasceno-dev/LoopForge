[package]
name = "termtask"
version = "0.1.0"
edition = "2021"
description = "TermTask – Kanban CLI & Timer Pomodoro in Rust with TUI"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = "0.4"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.8"

[[test]]
name = "integration_tests"
harness = false