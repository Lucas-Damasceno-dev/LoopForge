site_name: LoopForge v6 Documentation
site_description: Autonomous Agent Governance and Pipeline Orchestrator
site_author: LoopForge Team
repo_url: https://github.com/Lucas-Damasceno-dev/LoopForge
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    scheme: slate
    primary: cyan
    accent: purple
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture & 9-Agent Pipeline: architecture.md
  - Architecture (English): ARCHITECTURE.md
  - Configuration: configuration.md
  - CLI Reference: cli-reference.md
  - REST & WebSockets API: api-reference.md
  - OpenCode Contract: OPENCODE_CONTRACT.md
