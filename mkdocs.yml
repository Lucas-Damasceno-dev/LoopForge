site_name: LoopForge v6 Documentation
site_description: Autonomous Agent Governance and Pipeline Orchestrator
site_author: LoopForge Team
theme:
  name: material
  palette:
    scheme: slate
    primary: cyan
    accent: purple
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture & 7-Agent Pipeline: architecture.md
  - CLI Reference: cli-reference.md
  - REST & WebSockets API: api-reference.md
