[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-genome"
version = "0.1.0"
description = "Perfil estrutural e semântico multidimensional de qualquer codebase em Python e TypeScript para agentes de IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "tree-sitter>=0.20.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.scripts]
genome = "genome.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
