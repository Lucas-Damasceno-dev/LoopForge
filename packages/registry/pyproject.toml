[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-registry"
version = "0.1.0"
description = "Registro central de contratos de interface pública entre agentes de IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "requests>=2.28.0",
]

[project.scripts]
registry = "registry.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
