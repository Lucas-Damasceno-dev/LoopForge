[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-retro"
version = "0.1.0"
description = "Síntese autônoma pós-sessão e realimentação de aprendizados para agentes de IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
retro = "retro.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
